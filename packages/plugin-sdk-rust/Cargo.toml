[package]
name = "tessera-plugin"
version = "0.1.0"
edition = "2021"
description = "Write Tessera plugins in Rust (WebAssembly)"
license = "MIT"

[dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
