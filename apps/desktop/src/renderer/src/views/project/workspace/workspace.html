<div class="tessera-workspace-area">
  <div data-dock></div>
  <aside class="tessera-drawer" data-drawer>
    <div class="tessera-drawer-inner">
      <h3 data-i18n="drawer.title"></h3>
      <label class="atrium-input-icon tessera-drawer-search">
        <i class="bi bi-search"></i>
        <input class="atrium-input" data-search data-i18n-placeholder="drawer.search" />
      </label>
      <div class="tessera-drawer-cats" data-categories></div>
      <div class="tessera-drawer-list" data-widgets></div>
      <p class="tessera-drawer-hint"><i class="bi bi-info-circle"></i> <span data-i18n="drawer.hint"></span></p>
    </div>
  </aside>
</div>
