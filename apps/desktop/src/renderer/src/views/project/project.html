<div class="tessera-project-view" hidden>
  <div class="tessera-loading" data-loading>
    <div class="tessera-loading-skeleton">
      <div class="atrium-skeleton"></div>
      <div class="atrium-skeleton"></div>
      <div class="atrium-skeleton"></div>
      <div class="atrium-skeleton"></div>
    </div>
    <div class="tessera-loading-card">
      <div class="tessera-loading-cover" data-cover><i class="bi" data-kind></i></div>
      <h3 data-name></h3>
      <p data-path></p>
      <div class="atrium-progress is-thin"><div class="atrium-progress-fill"></div></div>
      <div class="tessera-loading-step"><span class="tessera-spinner"></span><span data-step></span></div>
    </div>
  </div>
  <div class="tessera-workspace" data-workspace hidden>
    <div class="atrium-empty">
      <i class="bi bi-grid-1x2"></i>
      <h3 data-i18n="project.emptyTitle"></h3>
      <p data-i18n="project.emptyText"></p>
      <div class="tessera-workspace-actions">
        <button type="button" class="atrium-btn atrium-btn-secondary" data-reveal><i class="bi bi-folder2-open"></i> <span data-i18n="project.reveal"></span></button>
        <button type="button" class="atrium-btn atrium-btn-primary" data-back><i class="bi bi-arrow-left"></i> <span data-i18n="project.back"></span></button>
      </div>
    </div>
  </div>
</div>
