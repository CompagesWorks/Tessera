<div class="tessera-form">
  <div class="tessera-form-field">
    <label class="atrium-label" data-i18n="workspace.name"></label>
    <input class="atrium-input" data-name maxlength="40" />
    <div class="tessera-form-error" data-error></div>
  </div>
  <div class="tessera-form-field">
    <label class="atrium-label" data-i18n="workspace.icon"></label>
    <div class="tessera-icon-grid" data-icons></div>
  </div>
  <div class="tessera-form-field" data-start-field>
    <label class="atrium-label" data-i18n="workspace.start"></label>
    <div class="tessera-chip-list" data-start></div>
  </div>
</div>
