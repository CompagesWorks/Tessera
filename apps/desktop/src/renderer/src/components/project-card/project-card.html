<article class="tessera-card" tabindex="0">
  <div class="tessera-card-cover" data-cover>
    <i class="bi tessera-card-kind" data-kind></i>
    <span class="atrium-badge tessera-card-status" data-status></span>
    <i class="bi bi-star-fill tessera-card-fav" data-fav></i>
  </div>
  <div class="tessera-card-body">
    <div class="tessera-card-title" data-name></div>
    <div class="tessera-card-meta" data-meta></div>
    <div class="tessera-card-tags" data-tags></div>
  </div>
</article>
