<div class="tessera-notes">
  <div class="tessera-notes-bar">
    <select class="tessera-notes-select" data-select></select>
    <div data-mode></div>
    <button type="button" class="atrium-icon-btn-sm" data-new><i class="bi bi-plus-lg"></i></button>
    <button type="button" class="atrium-icon-btn-sm" data-more><i class="bi bi-three-dots"></i></button>
  </div>
  <div class="tessera-notes-body" data-body>
    <textarea class="tessera-notes-area" data-area maxlength="1000000"></textarea>
    <div class="tessera-notes-preview" data-preview></div>
  </div>
  <div class="tessera-notes-status" data-status></div>
</div>
