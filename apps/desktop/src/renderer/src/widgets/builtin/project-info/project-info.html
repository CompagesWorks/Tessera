<div class="tessera-info">
  <div class="tessera-info-head">
    <i class="bi" data-kind></i>
    <div>
      <div class="tessera-info-name" data-name></div>
      <div class="tessera-info-sub" data-sub></div>
    </div>
  </div>
  <dl class="tessera-info-list">
    <dt data-i18n="widget.info.status"></dt>
    <dd data-status></dd>
    <dt data-i18n="widget.info.created"></dt>
    <dd data-created></dd>
    <dt data-i18n="widget.info.updated"></dt>
    <dd data-updated></dd>
    <dt data-i18n="widget.info.folder"></dt>
    <dd class="tessera-info-path" data-path></dd>
  </dl>
</div>
