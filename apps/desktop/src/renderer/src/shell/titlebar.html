<header class="atrium-titlebar">
  <div class="atrium-titlebar-left">
    <span data-logo></span>
    <span class="atrium-titlebar-title">Tessera</span>
    <span class="tessera-crumb" data-crumb></span>
  </div>
  <div class="tessera-title-actions" data-title-actions>
    <button type="button" class="tessera-title-btn" data-export>
      <i class="bi bi-box-arrow-up"></i><span data-i18n="export.button"></span>
    </button>
    <button type="button" class="tessera-title-btn" data-edit-layout>
      <i class="bi bi-pencil-square"></i><span data-i18n="layout.edit"></span>
    </button>
  </div>
  <div class="atrium-titlebar-buttons">
    <button class="atrium-titlebar-btn" data-atrium-window="minimize" data-i18n-label="window.minimize">
      <svg viewBox="0 0 12 12" fill="currentColor"><rect x="0" y="5" width="12" height="2" /></svg>
    </button>
    <button class="atrium-titlebar-btn" data-atrium-window="maximize" data-i18n-label="window.maximize">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="10" height="10" /></svg>
    </button>
    <button class="atrium-titlebar-btn is-close" data-atrium-window="close" data-i18n-label="window.close">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 1l10 10M11 1L1 11" /></svg>
    </button>
  </div>
</header>
