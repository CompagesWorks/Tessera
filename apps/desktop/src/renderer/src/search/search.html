<div class="tessera-search">
  <div class="tessera-search-bar">
    <i class="bi bi-search"></i>
    <input class="atrium-input" data-input type="text" spellcheck="false" autocomplete="off" data-i18n-placeholder="search.placeholder" />
    <label class="tessera-search-content">
      <span data-i18n="search.inContent"></span>
      <span class="atrium-switch"><input type="checkbox" data-content checked /><span class="atrium-switch-slider"></span></span>
    </label>
  </div>
  <div class="tessera-search-body">
    <div class="tessera-search-results" data-results role="listbox"></div>
    <div class="tessera-search-preview" data-preview></div>
  </div>
  <div class="tessera-search-foot" data-status></div>
</div>
