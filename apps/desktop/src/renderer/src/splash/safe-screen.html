<div class="tessera-safe">
  <div class="tessera-safe-head">
    <i class="bi bi-shield-exclamation"></i>
    <h2 data-i18n="safe.title"></h2>
  </div>
  <p class="tessera-safe-reason" data-reason></p>
  <div class="tessera-safe-option">
    <span><span data-i18n="safe.disableAll"></span><small data-i18n="safe.disableAllHint"></small></span>
    <label class="atrium-switch"><input type="checkbox" data-disable-all /><span class="atrium-switch-slider"></span></label>
  </div>
  <div class="tessera-safe-option" data-plugin-row>
    <span><span data-i18n="safe.pickPlugins"></span><span class="tessera-safe-plugins" data-plugins></span></span>
  </div>
  <div class="tessera-safe-option">
    <span><span data-i18n="safe.resetLayouts"></span><small data-i18n="safe.resetLayoutsHint"></small></span>
    <label class="atrium-switch"><input type="checkbox" data-layouts /><span class="atrium-switch-slider"></span></label>
  </div>
  <div class="tessera-safe-option">
    <span><span data-i18n="safe.resetLook"></span><small data-i18n="safe.resetLookHint"></small></span>
    <label class="atrium-switch"><input type="checkbox" data-look checked /><span class="atrium-switch-slider"></span></label>
  </div>
  <div class="tessera-safe-option">
    <span data-i18n="safe.clearCache"></span>
    <label class="atrium-switch"><input type="checkbox" data-cache /><span class="atrium-switch-slider"></span></label>
  </div>
  <div class="tessera-safe-actions">
    <button type="button" class="atrium-btn atrium-btn-secondary is-danger" data-reset><i class="bi bi-arrow-counterclockwise"></i> <span data-i18n="safe.reset"></span></button>
    <button type="button" class="atrium-btn atrium-btn-secondary" data-data><i class="bi bi-folder2-open"></i> <span data-i18n="safe.openData"></span></button>
    <button type="button" class="atrium-btn atrium-btn-secondary" data-stay><span data-i18n="safe.stay"></span></button>
    <button type="button" class="atrium-btn atrium-btn-primary" data-apply><i class="bi bi-play-fill"></i> <span data-i18n="safe.apply"></span></button>
  </div>
</div>
