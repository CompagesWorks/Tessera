<div class="tessera-splash" role="status" aria-live="polite">

    <div class="tessera-splash-art" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="tessera-splash-info">

        <span data-logo></span>
        <h1>Tessera</h1>
      </div>
      <div class="tessera-splash-version" data-version></div>
      <div class="tessera-splash-foot">

        <div class="tessera-splash-step" data-step></div>
        <div class="tessera-splash-hint" data-hint></div>
