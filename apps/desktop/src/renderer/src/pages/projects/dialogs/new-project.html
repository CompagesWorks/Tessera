<div class="tessera-form">
  <div class="tessera-form-field">
    <label class="atrium-label" data-i18n="newProject.name"></label>
    <input class="atrium-input" data-name maxlength="80" data-i18n-placeholder="newProject.namePlaceholder" />
    <div class="tessera-form-error" data-error></div>
  </div>
  <div class="tessera-form-field">
    <label class="atrium-label" data-i18n="newProject.kind"></label>
    <div class="tessera-chip-list" data-kind></div>
  </div>
  <div class="tessera-form-field">
    <label class="atrium-label" data-i18n="newProject.location"></label>
    <div class="tessera-location">
      <span class="tessera-location-path" data-location></span>
      <button type="button" class="atrium-btn atrium-btn-secondary" data-change data-i18n="dialog.change"></button>
    </div>
    <div class="tessera-form-hint" data-hint></div>
  </div>
</div>
