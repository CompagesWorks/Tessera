<div class="tessera-gbp">
  <header class="tessera-gbp-toolbar">
    <h1 data-i18n="gbpage.title"></h1>
    <span class="tessera-gbp-who" data-who></span>
    <button type="button" class="atrium-btn atrium-btn-secondary" data-profile><i class="bi bi-box-arrow-up-right"></i> <span data-i18n="gbpage.profile"></span></button>
    <button type="button" class="atrium-btn atrium-btn-secondary" data-refresh><i class="bi bi-arrow-clockwise"></i> <span data-i18n="gbpage.refresh"></span></button>
  </header>
  <nav class="tessera-gbp-tabs" data-tabs hidden>
    <button type="button" class="atrium-chip-btn is-active" data-tab="overview"><i class="bi bi-grid"></i> <span data-i18n="gbpage.tab.overview"></span></button>
    <button type="button" class="atrium-chip-btn" data-tab="comments"><i class="bi bi-chat-left-text"></i> <span data-i18n="gbpage.tab.comments"></span></button>
  </nav>
  <div class="tessera-gbp-body" data-body></div>
  <div class="tessera-gbp-threads" data-threads hidden>
    <div class="tessera-gbp-modlist" data-mod-list></div>
    <div class="tessera-gbp-thread" data-thread></div>
  </div>
</div>
