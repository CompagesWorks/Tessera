<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="/__tessera/sdk.js"></script>
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <header>
      <select id="file" class="atrium-input" data-i18n-label="file.label"></select>
      <button id="reset" class="atrium-btn atrium-btn-secondary" type="button" data-i18n-title="reset" data-i18n-label="reset"><i class="bi bi-arrows-fullscreen"></i></button>
      <label class="toggle"><input id="show-bones" type="checkbox" /> <span data-i18n="showBones"></span></label>
      <button id="shading-toggle" class="atrium-btn atrium-btn-secondary" type="button" aria-expanded="false" aria-controls="shading" data-i18n-title="shading" data-i18n-label="shading"><i class="bi bi-sliders"></i></button>
      <button id="save" class="atrium-btn atrium-btn-primary" type="button" disabled data-i18n="save"></button>
    </header>
    <p id="scan" class="scan" role="status" aria-live="polite" hidden data-i18n="scanning"></p>
    <main id="view" hidden>
      <aside>
        <div class="tabs" role="tablist">
          <button id="tab-meshes" class="tab" type="button" role="tab" aria-selected="true" aria-controls="meshes" data-i18n="tab.meshes"></button>
          <button id="tab-materials" class="tab" type="button" role="tab" aria-selected="false" aria-controls="materials" data-i18n="tab.materials"></button>
          <button id="tab-bones" class="tab" type="button" role="tab" aria-selected="false" aria-controls="bones" data-i18n="tab.bones"></button>
          <button id="tab-files" class="tab" type="button" role="tab" aria-selected="false" aria-controls="files" data-i18n="tab.files"></button>
        </div>
        <input id="filter" class="atrium-input" type="search" data-i18n-placeholder="filter" data-i18n-label="filter.label" />
        <ul id="meshes" class="list" role="tabpanel" aria-labelledby="tab-meshes"></ul>
        <ul id="materials" class="list" role="tabpanel" aria-labelledby="tab-materials" hidden></ul>
        <ul id="bones" class="list" role="tabpanel" aria-labelledby="tab-bones" hidden></ul>
        <ul id="files" class="list" role="tabpanel" aria-labelledby="tab-files" hidden></ul>
      </aside>
      <div class="center">
        <div class="stage">
          <canvas id="canvas" data-i18n-label="canvas.label"></canvas>
          <form id="shading" class="shading" hidden>
            <label class="toggle"><input name="pbr" type="checkbox" checked /> <span data-i18n="shading.pbr"></span></label>
            <label><span data-i18n="shading.light"></span><input name="lightPower" class="atrium-range" type="range" min="0" max="4" step="0.05" value="1.5" /><output>1.5</output></label>
            <label><span data-i18n="shading.ambient"></span><input name="ambientPower" class="atrium-range" type="range" min="0" max="3" step="0.05" value="1.2" /><output>1.2</output></label>
            <label><span data-i18n="shading.specular"></span><input name="specularPower" class="atrium-range" type="range" min="0" max="3" step="0.05" value="1" /><output>1</output></label>
            <label><span data-i18n="shading.bump"></span><input name="bumpPower" class="atrium-range" type="range" min="0" max="2" step="0.05" value="1" /><output>1</output></label>
            <label><span data-i18n="shading.rim"></span><input name="rimPower" class="atrium-range" type="range" min="0" max="1" step="0.05" value="0" /><output>0</output></label>
            <label><span data-i18n="shading.exposure"></span><input name="exposure" class="atrium-range" type="range" min="0.2" max="3" step="0.05" value="1" /><output>1</output></label>
            <button class="atrium-btn atrium-btn-secondary" type="reset" data-i18n="shading.reset"></button>
          </form>
          <p id="status" class="status" role="status" aria-live="polite" hidden></p>
          <p class="hint" data-i18n="controls"></p>
        </div>
        <div class="timeline">
          <select id="anim" class="atrium-input" data-i18n-label="anim.label"></select>
          <button id="play" class="atrium-btn atrium-btn-secondary" type="button" disabled data-i18n-title="play" data-i18n-label="play"><i class="bi bi-play-fill"></i></button>
          <input id="frame" class="atrium-range" type="range" min="0" max="0" value="0" step="1" disabled data-i18n-label="frame.label" />
          <span id="frame-label">0 / 0</span>
          <label class="toggle"><span data-i18n="speed"></span> <input id="speed" class="atrium-input" type="number" min="0.05" max="4" step="0.05" value="1" /></label>
          <label class="toggle"><input id="loop" type="checkbox" checked /> <span data-i18n="loop"></span></label>
        </div>
      </div>
      <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" tabindex="0" hidden data-i18n-label="resize"></div>
      <section id="inspector" hidden>
        <div class="inspector-head">
          <div>
            <h3 id="material-name"></h3>
            <p id="material-shader"></p>
          </div>
          <div class="actions">
            <button id="rename" class="icon-btn" type="button" data-i18n-title="material.rename" data-i18n-label="material.rename"><i class="bi bi-pencil"></i></button>
            <button id="duplicate" class="icon-btn" type="button" data-i18n-title="material.duplicate" data-i18n-label="material.duplicate"><i class="bi bi-copy"></i></button>
            <button id="delete" class="icon-btn danger" type="button" data-i18n-title="material.delete" data-i18n-label="material.delete"><i class="bi bi-trash"></i></button>
            <button id="close" class="icon-btn" type="button" data-i18n-title="close" data-i18n-label="close"><i class="bi bi-x-lg"></i></button>
          </div>
        </div>
        <div id="params"></div>
      </section>
    </main>
    <datalist id="texture-names"></datalist>
    <p id="empty" class="atrium-empty" hidden data-i18n="empty"></p>
    <script src="model.js"></script>
    <script src="anim.js"></script>
    <script src="render.js"></script>
    <script src="materials.js"></script>
    <script src="widget.js"></script>
  </body>
</html>
