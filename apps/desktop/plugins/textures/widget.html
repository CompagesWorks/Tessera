<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="/__tessera/sdk.js"></script>
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <header>
      <input id="filter" class="atrium-input" type="search" data-i18n-placeholder="filter" data-i18n-label="filter.label" />
      <label>
        <span data-i18n="quality"></span>
        <select id="quality" class="atrium-input">
          <option value="Fast" data-i18n="quality.fast"></option>
          <option value="Normal" data-i18n="quality.normal" selected></option>
          <option value="Slow" data-i18n="quality.slow"></option>
        </select>
      </label>
      <label data-i18n-title="gammaFix.hint">
        <input id="gamma" type="checkbox" />
        <span data-i18n="gammaFix"></span>
      </label>
      <button id="all" class="atrium-btn atrium-btn-primary" type="button" data-i18n="convertAll"></button>
    </header>
    <table>
      <thead>
        <tr>
          <th data-i18n="column.texture"></th>
          <th data-i18n="column.output"></th>
          <th data-i18n="column.format"></th>
          <th data-i18n="column.mipmaps"></th>
          <th><span class="sr-only" data-i18n="convert"></span></th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
    <p id="empty" class="atrium-empty" hidden data-i18n="empty"></p>
    <div id="drop" class="drop" hidden><i class="bi bi-download"></i> <span data-i18n="drop"></span></div>
    <script src="formats.js"></script>
    <script src="widget.js"></script>
  </body>
</html>
