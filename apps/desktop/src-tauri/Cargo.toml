[package]
name = "tessera"
version = "0.1.0"
description = "Tessera desktop app"
edition = "2021"
rust-version = "1.90"

[lib]
name = "tessera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
unicode-normalization = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
notify = "8"
trash = "5"
aes-gcm = "0.10"
rand = "0.8"
percent-encoding = "2"
dunce = "1"
nutexb = { version = "0.7", features = ["ddsfile"] }
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image", "encode", "strum"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tga", "tiff", "ico"] }
sevenz-rust2 = { version = "0.20", default-features = false, features = ["bzip2", "ppmd", "deflate"] }
unrar = "0.5"
md-5 = "0.11"
tegra_swizzle = "0.3"
smash-arc = { version = "0.6", default-features = false, features = ["dir-listing", "rust-zstd"] }
ssbh_data = { version = "0.19", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
webview2-com = "0.39"

[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3", features = ["apple-native", "linux-native-sync-persistent", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3
