[package]
name = "hello-rust"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tessera-plugin = { path = "../../../packages/plugin-sdk-rust" }
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "Window", "Event", "EventTarget"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
