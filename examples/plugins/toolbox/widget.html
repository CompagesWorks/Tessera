<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="/__tessera/sdk.js"></script>
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <main class="toolbox">
      <section>
        <h4><i class="bi bi-pencil-square"></i> Projet</h4>
        <button class="atrium-btn atrium-btn-secondary" id="write">Écrire toolbox.txt</button>
        <button class="atrium-btn atrium-btn-secondary" id="private">Écrire le cache privé</button>
      </section>
      <section>
        <h4><i class="bi bi-folder-symlink"></i> Dossier externe</h4>
        <button class="atrium-btn atrium-btn-secondary" id="pick">Choisir</button>
        <button class="atrium-btn atrium-btn-secondary" id="external">Lister</button>
      </section>
      <section>
        <h4><i class="bi bi-globe2"></i> Réseau</h4>
        <button class="atrium-btn atrium-btn-secondary" id="github">api.github.com</button>
        <button class="atrium-btn atrium-btn-secondary" id="blocked">example.com (refusé)</button>
      </section>
      <section>
        <h4><i class="bi bi-key"></i> Secrets</h4>
        <input class="atrium-input" id="secret" placeholder="Jeton" />
        <button class="atrium-btn atrium-btn-secondary" id="save">Enregistrer</button>
        <button class="atrium-btn atrium-btn-secondary" id="load">Relire</button>
      </section>
      <section>
        <h4><i class="bi bi-terminal-plus"></i> Programme du PC</h4>
        <button class="atrium-btn atrium-btn-secondary" id="pickGit">Choisir git</button>
        <button class="atrium-btn atrium-btn-secondary" id="gitVersion">git --version</button>
      </section>
      <section>
        <h4><i class="bi bi-box-arrow-up-right"></i> Système</h4>
        <button class="atrium-btn atrium-btn-secondary" id="copy">Copier</button>
        <button class="atrium-btn atrium-btn-secondary" id="notify">Notifier</button>
        <button class="atrium-btn atrium-btn-secondary" id="open">Ouvrir GitHub</button>
        <button class="atrium-btn atrium-btn-secondary" id="reveal">Montrer le projet</button>
        <button class="atrium-btn atrium-btn-secondary" id="projects">Mes projets</button>
      </section>
      <pre id="log"></pre>
    </main>
    <script src="widget.js"></script>
  </body>
</html>
